name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Branch churn must not queue behind abandoned runs. Tag runs are release
# evidence and must never be cancelled by a later push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  native-mod:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # The macOS Intel job reached 24m39s against the old 25-minute limit.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Exercise installed helpers from immutable historical revisions.
          fetch-depth: 0
      - name: Install jq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes jq libcurl4-openssl-dev pkg-config
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.93.1
      - name: Build production runtime assets
        run: python3 scripts/package-runtime.py
      - name: Install ShellCheck 0.11.0
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              platform=linux.x86_64
              checksum=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            Linux-ARM64)
              platform=linux.aarch64
              checksum=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            macOS-ARM64)
              platform=darwin.aarch64
              checksum=339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
              ;;
            macOS-X64)
              platform=darwin.x86_64
              checksum=c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
              ;;
            *) printf 'Unsupported runner: %s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.$platform.tar.gz" \
            -o "$RUNNER_TEMP/shellcheck.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/shellcheck.tar.gz" | shasum -a 256 --check --status
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: |
          for file in config.example.sh scripts/*.sh; do
            sh -n "$file" || exit
          done
      - name: Check release versions and changelog
        run: python3 scripts/release.py --check
      - name: Run the fast verification loop
        run: python3 scripts/verify.py --fast
      - name: Report bridge runtime versions
        run: |
          python3 --version
          jq --version
      - name: Run ShellCheck
        run: |
          shellcheck --version
          test "$(shellcheck --version | sed -n 's/^version: //p')" = 0.11.0
          shellcheck -s sh -e SC1090 config.example.sh scripts/*.sh
      - name: Check and test the Rust runtime
        run: |
          cargo fmt --manifest-path rust-backend/Cargo.toml --check
          cargo clippy --locked --release --all-targets --manifest-path rust-backend/Cargo.toml -- -D warnings
          cargo test --locked --release --manifest-path rust-backend/Cargo.toml
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 rust-backend/tests/transport_test.py -v
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 -B rust-backend/tests/setup_test.py -v
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 -B rust-backend/tests/setup_transport_test.py -v
          cargo build --locked --release --features fixture-http --manifest-path rust-backend/Cargo.toml
          python3 rust-backend/tests/parity_test.py -v
          python3 rust-backend/tests/clear_cache_test.py -v
      - name: Test bridge, setup and lifecycle compatibility with fictional data
        run: |
          python3 -B scripts/prepare-lifecycle-fixtures.py --output "$RUNNER_TEMP/jira-peek-history"
          JIRA_PEEK_MANAGEMENT_FIXTURE_BINARY="$PWD/rust-backend/target/release/jira-peek-bridge" \
          JIRA_PEEK_LEGACY_SOURCE="$RUNNER_TEMP/jira-peek-history/v0.9.1" \
          JIRA_PEEK_HISTORICAL_SOURCES="$RUNNER_TEMP/jira-peek-history" \
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Verify complete REST lifecycle without Python jq curl or hash utilities
        run: |
          JIRA_PEEK_MANAGEMENT_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" \
          JIRA_PEEK_SOURCE_FIXTURE="$PWD" \
          JIRA_PEEK_FIXTURE_BINARY="$PWD/rust-backend/target/release/jira-peek-bridge" \
          JIRA_PEEK_LEGACY_SOURCE_FIXTURE="$RUNNER_TEMP/jira-peek-history/v0.9.1" \
          PYTHONDONTWRITEBYTECODE=1 python3 rust-backend/tests/lifecycle_acceptance_test.py -v
      - name: Retain verified production assets for an explicitly authorized release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ runner.os }}-${{ runner.arch }}
          path: .release-runtime/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
