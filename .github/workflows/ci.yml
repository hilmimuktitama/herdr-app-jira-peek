name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-mod:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Exercise installed helpers from immutable historical revisions.
          fetch-depth: 0
      - name: Install jq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes jq libcurl4-openssl-dev pkg-config
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.93.1
      - name: Build production runtime assets
        run: python3 scripts/package-runtime.py
      - name: Install ShellCheck 0.11.0
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              platform=linux.x86_64
              checksum=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            Linux-ARM64)
              platform=linux.aarch64
              checksum=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            macOS-ARM64)
              platform=darwin.aarch64
              checksum=339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
              ;;
            macOS-X64)
              platform=darwin.x86_64
              checksum=c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
              ;;
            *) printf 'Unsupported runner: %s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.$platform.tar.gz" \
            -o "$RUNNER_TEMP/shellcheck.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/shellcheck.tar.gz" | shasum -a 256 --check --status
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: |
          for file in config.example.sh scripts/*.sh; do
            sh -n "$file" || exit
          done
      - name: Check release versions and changelog
        run: python3 scripts/release.py --check
      - name: Test native mod state and asynchronous requests
        run: node --test tests/*.test.js tests/reliability/*.test.js
      - name: Report bridge runtime versions
        run: |
          python3 --version
          jq --version
      - name: Test bridge, setup and standalone installation with fictional data
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Run ShellCheck
        run: |
          shellcheck --version
          test "$(shellcheck --version | sed -n 's/^version: //p')" = 0.11.0
          shellcheck -s sh -e SC1090 config.example.sh scripts/*.sh
      - name: Check and test the Rust runtime
        run: |
          cargo fmt --manifest-path rust-backend/Cargo.toml --check
          cargo clippy --locked --release --manifest-path rust-backend/Cargo.toml -- -D warnings
          cargo test --locked --release --manifest-path rust-backend/Cargo.toml
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 rust-backend/tests/transport_test.py -v
          cargo build --locked --release --features fixture-http --manifest-path rust-backend/Cargo.toml
          python3 rust-backend/tests/parity_test.py -v
      - name: Retain verified production assets for an explicitly authorized release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ runner.os }}-${{ runner.arch }}
          path: .release-runtime/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
