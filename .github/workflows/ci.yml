name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: Check scope (full is the merge-queue gate)
        type: choice
        options: [full, fast]
        default: full

# Branch churn must not queue behind abandoned runs. Tag runs are release
# evidence and must never be cancelled by a later push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  RUST_VERSION: 1.93.1

jobs:
  # Fast mode narrows PR feedback to Linux x64 and to the checks the diff can
  # reach. Main, tags, merge_queue and dispatches always run everything on all
  # four platforms. Unknown paths and empty diffs fail closed.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      os: ${{ steps.plan.outputs.os }}
      static: ${{ steps.plan.outputs.static }}
      rust: ${{ steps.plan.outputs.rust }}
      integration: ${{ steps.plan.outputs.integration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the selector
        run: python3 -B -m unittest discover -s tests -p 'ci_plan_test.py'
      - name: Select checks
        id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event_name == 'merge_group' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag'))) && 'full' || 'fast') }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then
            BASE=origin/main
          fi
          python3 scripts/ci_plan.py --mode "$MODE" --base "$BASE" --github-output

  # Cheap, platform-independent checks. This job always runs, including for
  # documentation-only changes, because release metadata can break there.
  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install ShellCheck 0.11.0
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              platform=linux.x86_64
              checksum=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            Linux-ARM64)
              platform=linux.aarch64
              checksum=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            macOS-ARM64)
              platform=darwin.aarch64
              checksum=339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
              ;;
            macOS-X64)
              platform=darwin.x86_64
              checksum=c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
              ;;
            *) printf 'Unsupported runner: %s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.$platform.tar.gz" \
            -o "$RUNNER_TEMP/shellcheck.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/shellcheck.tar.gz" | shasum -a 256 --check --status
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Check shell syntax
        run: |
          for file in config.example.sh scripts/*.sh .githooks/pre-push; do
            sh -n "$file" || exit
          done
      - name: Check release versions and changelog
        run: python3 scripts/release.py --check
      - name: Run the fast verification loop
        run: python3 scripts/verify.py --fast
      - name: Run ShellCheck
        run: |
          shellcheck --version
          test "$(shellcheck --version | sed -n 's/^version: //p')" = 0.11.0
          shellcheck -s sh -e SC1090 config.example.sh scripts/*.sh .githooks/pre-push

  # Lint and unit tests run beside the protocol tests so neither waits for the
  # other's build. Both reuse the same dependency cache seeded from main.
  rust-lint:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'fast' && 4 || 12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install jq and libcurl headers on Linux
        if: runner.os == 'Linux'
        run: |
          missing=()
          command -v jq >/dev/null || missing+=(jq)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists libcurl 2>/dev/null || missing+=(libcurl4-openssl-dev)
          if [ "${#missing[@]}" -gt 0 ]; then
            if ! sudo apt-get install --no-install-recommends --yes "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes "${missing[@]}"
            fi
          fi
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: Cache Rust toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.rustup/toolchains/1.93.1-*
          key: rustup-1.93.1-${{ runner.os }}-${{ runner.arch }}
      - name: Select Rust toolchain
        run: |
          if ! rustup toolchain list | grep -q "^${RUST_VERSION}"; then
            rustup toolchain install "$RUST_VERSION" --profile minimal
          fi
          rustup component add clippy rustfmt --toolchain "$RUST_VERSION"
          rustup override set "$RUST_VERSION"
      - name: Cache Rust builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: cargo-lint-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: |
            cargo-lint-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-
      - name: Check formatting, Clippy and unit tests
        run: |
          cargo fmt --manifest-path rust-backend/Cargo.toml --check
          cargo clippy --locked --release --all-targets --manifest-path rust-backend/Cargo.toml -- -D warnings
          cargo test --locked --release --manifest-path rust-backend/Cargo.toml

  rust-protocol:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'fast' && 4 || 12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install jq and libcurl headers on Linux
        if: runner.os == 'Linux'
        run: |
          missing=()
          command -v jq >/dev/null || missing+=(jq)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists libcurl 2>/dev/null || missing+=(libcurl4-openssl-dev)
          if [ "${#missing[@]}" -gt 0 ]; then
            if ! sudo apt-get install --no-install-recommends --yes "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes "${missing[@]}"
            fi
          fi
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: Cache Rust toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.rustup/toolchains/1.93.1-*
          key: rustup-1.93.1-${{ runner.os }}-${{ runner.arch }}
      - name: Select Rust toolchain
        run: |
          if ! rustup toolchain list | grep -q "^${RUST_VERSION}"; then
            rustup toolchain install "$RUST_VERSION" --profile minimal
          fi
          rustup component add clippy rustfmt --toolchain "$RUST_VERSION"
          rustup override set "$RUST_VERSION"
      - name: Cache Rust builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: cargo-protocol-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: |
            cargo-protocol-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-
      - name: Build the production and fixture runtimes in parallel
        run: ./scripts/ci_build_assets.sh
      - name: Test the bridge protocol with fictional fixtures
        run: |
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 rust-backend/tests/transport_test.py -v
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 -B rust-backend/tests/setup_test.py -v
          JIRA_PEEK_PRODUCTION_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" python3 -B rust-backend/tests/setup_transport_test.py -v
          python3 rust-backend/tests/clear_cache_test.py -v
          python3 scripts/ci_parity.py --count 2

  # Install, update and lifecycle compatibility. The historical fixtures are
  # deterministic and expensive to rebuild, so they are cached across runs.
  integration:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'fast' && 4 || 12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install jq and libcurl headers on Linux
        if: runner.os == 'Linux'
        run: |
          missing=()
          command -v jq >/dev/null || missing+=(jq)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists libcurl 2>/dev/null || missing+=(libcurl4-openssl-dev)
          if [ "${#missing[@]}" -gt 0 ]; then
            if ! sudo apt-get install --no-install-recommends --yes "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes "${missing[@]}"
            fi
          fi
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: Cache Rust toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.rustup/toolchains/1.93.1-*
          key: rustup-1.93.1-${{ runner.os }}-${{ runner.arch }}
      - name: Select Rust toolchain
        run: |
          if ! rustup toolchain list | grep -q "^${RUST_VERSION}"; then
            rustup toolchain install "$RUST_VERSION" --profile minimal
          fi
          rustup component add clippy rustfmt --toolchain "$RUST_VERSION"
          rustup override set "$RUST_VERSION"
      - name: Cache Rust builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: cargo-integration-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: |
            cargo-integration-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-
      - name: Cache historical fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jira-peek-history
          key: fixtures-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-backend/src/management/source-profiles.json', 'scripts/prepare-lifecycle-fixtures.py') }}
      - name: Build the production and fixture runtimes in parallel
        run: ./scripts/ci_build_assets.sh
      - name: Prepare historical fixtures once per profile set
        run: |
          history="$RUNNER_TEMP/jira-peek-history"
          if [ ! -f "$history/complete.json" ]; then
            rm -rf "$history"
            python3 -B scripts/prepare-lifecycle-fixtures.py --output "$history"
          fi
      - name: Show shard plan
        run: python3 scripts/ci_shards.py --check
      - name: Test bridge, setup and lifecycle compatibility with fictional data
        run: |
          export JIRA_PEEK_MANAGEMENT_FIXTURE_BINARY="$PWD/rust-backend/target/release/jira-peek-bridge"
          export JIRA_PEEK_LEGACY_SOURCE="$RUNNER_TEMP/jira-peek-history/v0.9.1"
          export JIRA_PEEK_HISTORICAL_SOURCES="$RUNNER_TEMP/jira-peek-history"
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci_run_shard.py --shard "${{ matrix.shard }}" --count 2
      - name: Retain verified production assets for an explicitly authorized release
        if: matrix.shard == 0 && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ runner.os }}-${{ runner.arch }}
          path: .release-runtime/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Lifecycle acceptance needs both binaries but no Python shard. Running it
  # alone keeps its 20 seconds off the integration critical path.
  acceptance:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'fast' && 4 || 12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install jq and libcurl headers on Linux
        if: runner.os == 'Linux'
        run: |
          missing=()
          command -v jq >/dev/null || missing+=(jq)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists libcurl 2>/dev/null || missing+=(libcurl4-openssl-dev)
          if [ "${#missing[@]}" -gt 0 ]; then
            if ! sudo apt-get install --no-install-recommends --yes "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes "${missing[@]}"
            fi
          fi
      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: Cache Rust toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.rustup/toolchains/1.93.1-*
          key: rustup-1.93.1-${{ runner.os }}-${{ runner.arch }}
      - name: Select Rust toolchain
        run: |
          if ! rustup toolchain list | grep -q "^${RUST_VERSION}"; then
            rustup toolchain install "$RUST_VERSION" --profile minimal
          fi
          rustup component add clippy rustfmt --toolchain "$RUST_VERSION"
          rustup override set "$RUST_VERSION"
      - name: Cache Rust builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: cargo-integration-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: |
            cargo-integration-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-
      - name: Cache historical fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jira-peek-history
          key: fixtures-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-backend/src/management/source-profiles.json', 'scripts/prepare-lifecycle-fixtures.py') }}
      - name: Build the production and fixture runtimes in parallel
        run: ./scripts/ci_build_assets.sh
      - name: Prepare historical fixtures once per profile set
        run: |
          history="$RUNNER_TEMP/jira-peek-history"
          if [ ! -f "$history/complete.json" ]; then
            rm -rf "$history"
            python3 -B scripts/prepare-lifecycle-fixtures.py --output "$history"
          fi
      - name: Verify complete REST lifecycle without Python jq curl or hash utilities
        run: |
          JIRA_PEEK_MANAGEMENT_BINARY="$PWD/rust-backend/target/production/release/jira-peek-bridge" \
          JIRA_PEEK_SOURCE_FIXTURE="$PWD" \
          JIRA_PEEK_FIXTURE_BINARY="$PWD/rust-backend/target/release/jira-peek-bridge" \
          JIRA_PEEK_LEGACY_SOURCE_FIXTURE="$RUNNER_TEMP/jira-peek-history/v0.9.1" \
          PYTHONDONTWRITEBYTECODE=1 python3 rust-backend/tests/lifecycle_acceptance_test.py -v

  # The only required branch-protection check. It passes when every check the
  # plan selected succeeded, and fails when a selected check was skipped.
  gate:
    needs: [plan, static, rust-lint, rust-protocol, integration, acceptance]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - name: Require every selected check
        run: |
          set -euo pipefail
          test "${{ needs.static.result }}" = success
          if [ "${{ needs.plan.outputs.rust }}" = true ]; then
            test "${{ needs.rust-lint.result }}" = success
            test "${{ needs.rust-protocol.result }}" = success
          fi
          if [ "${{ needs.plan.outputs.integration }}" = true ]; then
            test "${{ needs.integration.result }}" = success
            test "${{ needs.acceptance.result }}" = success
          fi
          echo "selected checks passed in ${{ needs.plan.outputs.mode }} mode"
